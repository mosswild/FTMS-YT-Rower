schema: "1.0"
id: "distance-pyramid-sprint"
title: "Sprint Distance Pyramid"
description: "Ascending and descending sprint pyramid (250m → 500m → 750m → 500m → 250m) developing tactical speed control and lactate buffering."
author: "British Rowing"
category: "pyramid"
difficulty: "advanced"
tags: ["pyramid", "ladder", "power", "sprint"]

settings:
  default_speed_mode: "cadence_zones"
  audio_modulation: true
  sound_alerts: true
  countdown_seconds: 5

segments:
  - type: "warmup"
    title: "Warmup"
    exit:
      duration: "5m"
    targets:
      spm: [20, 22]

  - type: "work"
    title: "Step 1: 250m Blast"
    exit:
      distance: "250m"
    targets:
      spm: [30, 34]
      split: ["1:38", "1:44"]
    cues:
      on_start: "Quick hands and aggressive jump off the footstretcher!"

  - type: "rest"
    title: "Rest"
    mode: "active"
    auto_pause_video: false
    exit:
      duration: "90s"
    targets:
      spm: [14, 18]

  - type: "work"
    title: "Step 2: 500m Pace"
    exit:
      distance: "500m"
    targets:
      spm: [28, 30]
      split: ["1:44", "1:48"]
    cues:
      on_start: "Lock into a solid 500m race rhythm."

  - type: "rest"
    title: "Rest"
    mode: "active"
    auto_pause_video: false
    exit:
      duration: "2m"
    targets:
      spm: [14, 18]

  - type: "work"
    title: "Step 3: 750m Peak"
    exit:
      distance: "750m"
    targets:
      spm: [26, 28]
      split: ["1:48", "1:52"]
    cues:
      on_start: "The peak of the mountain! Long strokes, big drive."

  - type: "rest"
    title: "Rest"
    mode: "active"
    auto_pause_video: false
    exit:
      duration: "2m30s"
    targets:
      spm: [14, 18]

  - type: "work"
    title: "Step 4: 500m Pace"
    exit:
      distance: "500m"
    targets:
      spm: [28, 30]
      split: ["1:44", "1:48"]
    cues:
      on_start: "Coming down the pyramid! Match your earlier 500m split."

  - type: "rest"
    title: "Rest"
    mode: "active"
    auto_pause_video: false
    exit:
      duration: "2m"
    targets:
      spm: [14, 18]

  - type: "work"
    title: "Step 5: 250m All-Out"
    exit:
      distance: "250m"
    targets:
      spm: [32, 36]
      split: ["1:35", "1:42"]
    cues:
      on_start: "Final sprint! Empty the tank to the line!"

  - type: "cooldown"
    title: "Cooldown"
    exit:
      duration: "4m"
    targets:
      spm: [16, 20]
